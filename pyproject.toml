[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomap-arbitrage"
version = "0.1.0"
description = "Evidence-backed local economic opportunity mapping and livelihood planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
geomap = "geomap_arbitrage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
