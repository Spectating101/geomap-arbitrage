name: GeoMap Arbitrage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Test
        run: pytest -q
      - name: Cited demo smoke
        run: geomap demo --json > /tmp/geomap-demo.json
      - name: Plan smoke
        run: geomap plan --json > /tmp/geomap-plan.json
      - name: GeoJSON smoke
        run: geomap geojson --output /tmp/geomap-demo.geojson
